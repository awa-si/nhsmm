[build-system]
requires = [
    "setuptools>=68",
    "setuptools_scm[toml]>=8.1",
    "wheel>=0.43",
]
build-backend = "setuptools.build_meta"

[project]
name = "nhsmm"
dynamic = ["version"]
description = "Context-aware neural Hidden Semi-Markov Models in PyTorch"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "AWA", email = "dev@awa.si" },
]
keywords = [
    "hsmm",
    "hidden semi-markov model",
    "neural hsmm",
    "pytorch",
    "sequence modeling",
    "temporal modeling",
    "survival",
    "state duration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
]
dev = [
    "black>=24.4",
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/awa-si/nhsmm"
Repository = "https://github.com/awa-si/nhsmm"
Issues = "https://github.com/awa-si/nhsmm/issues"
Documentation = "https://github.com/awa-si/nhsmm/wiki"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nhsmm*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:[-a-z0-9\\.]+)?)$"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["nhsmm", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
