name: Default distribution smoke

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/default-distributions.yml"

jobs:
  default-distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Test default.py contracts only after Student-t fix
        run: python -m pytest -q tests/test_default_distributions.py
