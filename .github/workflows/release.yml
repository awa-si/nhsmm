name: NHSMM release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: nhsmm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e . pytest

      - name: Require private test-owner access
        env:
          ML_STACK_TESTS_READ_TOKEN: ${{ secrets.ML_STACK_TESTS_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$ML_STACK_TESTS_READ_TOKEN" ]; then
            echo "::error::Set ML_STACK_TESTS_READ_TOKEN with read access to awa-si/nautilus."
            exit 1
          fi

      - name: Checkout canonical model tests
        uses: actions/checkout@v7
        with:
          repository: awa-si/nautilus
          token: ${{ secrets.ML_STACK_TESTS_READ_TOKEN }}
          ref: fd980de7e6b7f984354f32f74f373629b9c6e420
          path: ml-stack

      - name: Run full test suite
        working-directory: ml-stack
        run: python -m pytest -q tests/ml_stack/nhsmm

  build:
    name: Build and verify distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Install built wheel in a clean venv
        shell: bash
        run: |
          python -m venv /tmp/nhsmm-release-venv
          /tmp/nhsmm-release-venv/bin/python -m pip install --upgrade pip
          /tmp/nhsmm-release-venv/bin/python -m pip install dist/*.whl

      - name: Verify installed release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd /tmp
          /tmp/nhsmm-release-venv/bin/python - <<'PY'
          from importlib.metadata import version
          import os

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          installed = version("nhsmm")
          if installed != expected:
              raise RuntimeError(f"tag/version mismatch: tag={expected!r}, wheel={installed!r}")
          print("nhsmm", installed)
          PY

      - name: Verify installed public API
        shell: bash
        run: |
          cd /tmp
          /tmp/nhsmm-release-venv/bin/python - <<'PY'
          from importlib.metadata import version

          import nhsmm
          from nhsmm import ModelConfig, NHSMM, HSMMFilterRuntime, load_artifact, save_artifact

          cfg = ModelConfig(
              n_states=3,
              n_features=2,
              max_duration=4,
              context_dim=2,
              hidden_dim=2,
              causal=True,
              dropout=0.0,
              seed=7,
          )
          model = NHSMM(cfg, device="cpu")
          model.initialize_distributions()
          assert HSMMFilterRuntime
          assert load_artifact and save_artifact
          assert not hasattr(nhsmm, "ModelHealthThresholds")
          assert not hasattr(nhsmm, "evaluate_context_effect_replication")

          assert cfg.with_overrides(max_iter=20).max_iter == 20
          print("nhsmm", version("nhsmm"))
          print("public_api", "ok")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/nhsmm/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
