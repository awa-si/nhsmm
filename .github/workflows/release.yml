name: NHSMM release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Install built wheel in a clean venv
        shell: bash
        run: |
          python -m venv /tmp/nhsmm-release-venv
          /tmp/nhsmm-release-venv/bin/python -m pip install --upgrade pip
          /tmp/nhsmm-release-venv/bin/python -m pip install dist/*.whl

      - name: Verify installed release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd /tmp
          /tmp/nhsmm-release-venv/bin/python - <<'PY'
          from importlib.metadata import version
          import os

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          installed = version("nhsmm")
          if installed != expected:
              raise RuntimeError(f"tag/version mismatch: tag={expected!r}, wheel={installed!r}")
          print("nhsmm", installed)
          PY

      - name: Verify installed public API
        shell: bash
        run: |
          cd /tmp
          /tmp/nhsmm-release-venv/bin/python - <<'PY'
          from importlib.metadata import version

          from nhsmm import (
              ContextEvidenceConfig,
              ModelConfig,
              NHSMM,
              context_effect,
              evaluate_context_effect_replication,
              split_fit_context_effect_evidence,
          )

          cfg = ModelConfig(
              n_states=3,
              n_features=2,
              max_duration=4,
              context_dim=2,
              hidden_dim=2,
              causal=True,
              dropout=0.0,
              seed=7,
          )
          model = NHSMM(cfg, device="cpu")
          model.initialize_distributions()
          for component in ("initial", "duration", "emission", "transition"):
              effect = context_effect(model, [0.0, 0.0], component=component)
              if not getattr(effect, "shape", None):
                  raise RuntimeError(f"empty public context effect for {component}")

          assert ContextEvidenceConfig
          assert evaluate_context_effect_replication
          assert split_fit_context_effect_evidence
          print("nhsmm", version("nhsmm"))
          print("public_api", "ok")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/nhsmm/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
