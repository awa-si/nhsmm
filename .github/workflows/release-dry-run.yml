name: NHSMM release dry-run

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/release-dry-run.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Install built wheel in a clean venv
        shell: bash
        run: |
          python -m venv /tmp/nhsmm-release-venv
          /tmp/nhsmm-release-venv/bin/python -m pip install --upgrade pip
          /tmp/nhsmm-release-venv/bin/python -m pip install dist/*.whl

      - name: Verify installed public API
        shell: bash
        run: |
          cd /tmp
          /tmp/nhsmm-release-venv/bin/python - <<'PY'
          from importlib.metadata import version
          from nhsmm import (
              ContextEvidenceConfig,
              ModelConfig,
              NHSMM,
              context_effect,
              evaluate_context_effect_replication,
              split_fit_context_effect_evidence,
          )

          installed = version("nhsmm")
          cfg = ModelConfig(
              n_states=3,
              n_features=2,
              max_duration=4,
              context_dim=2,
              hidden_dim=2,
              causal=True,
              dropout=0.0,
              seed=7,
          )
          model = NHSMM(cfg, device="cpu")
          model.initialize_distributions()
          for component in ("initial", "duration", "emission", "transition"):
              effect = context_effect(model, [0.0, 0.0], component=component)
              if not getattr(effect, "shape", None):
                  raise RuntimeError(f"empty public context effect for {component}")

          assert ContextEvidenceConfig
          assert evaluate_context_effect_replication
          assert split_fit_context_effect_evidence
          print("nhsmm", installed)
          print("public_api", "ok")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: nhsmm-release-dry-run-distributions-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
