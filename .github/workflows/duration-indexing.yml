name: Duration indexing smoke

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/duration-indexing.yml"

jobs:
  duration-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Test fixed duration indexing contracts
        run: python -m pytest -q tests/test_duration_indexing.py
