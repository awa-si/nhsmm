name: NHSMM package validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nhsmm-package-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  multicomponent-identifiability:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile validation entry point
        run: python -m py_compile scripts/validate_multicomponent_identifiability.py

      - name: Run multi-component identifiability gate
        run: |
          mkdir -p validation-results
          python scripts/validate_multicomponent_identifiability.py \
            --scenario all \
            --workers 2 \
            --output validation-results/multicomponent-identifiability.json

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nhsmm-multicomponent-identifiability-${{ github.run_id }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14

  learning-prediction-usefulness:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile validation entry point
        run: python -m py_compile scripts/validate_learning_prediction.py

      - name: Run learning/prediction usefulness gate
        run: |
          mkdir -p validation-results
          python scripts/validate_learning_prediction.py \
            --scenario all \
            --seeds 401,402,403,404,405 \
            --workers 2 \
            --output validation-results/learning-prediction-usefulness.json

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nhsmm-learning-prediction-usefulness-${{ github.run_id }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
