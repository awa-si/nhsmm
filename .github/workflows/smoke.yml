name: NHSMM smoke

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

permissions:
  contents: read

concurrency:
  group: nhsmm-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare logs
        shell: bash
        run: |
          mkdir -p smoke-logs
          {
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            uname -a
          } | tee smoke-logs/environment.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Python diagnostics
        shell: bash
        run: |
          {
            python --version
            python -m pip --version
          } 2>&1 | tee smoke-logs/python.txt

      - name: Install CPU runtime and package
        shell: bash
        run: |
          set -o pipefail
          python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee smoke-logs/torch-install.txt
          python -m pip install -e . 2>&1 | tee smoke-logs/install.txt
          python -m pip check 2>&1 | tee smoke-logs/pip-check.txt

      - name: Public CPU package smoke
        shell: bash
        run: |
          set -o pipefail
          python scripts/smoke_cpu.py 2>&1 | tee smoke-logs/runtime.txt

      - name: Collect repository state
        if: always()
        shell: bash
        run: |
          {
            echo "sha=${GITHUB_SHA}"
            git status --short
            git log -1 --oneline
          } 2>&1 | tee smoke-logs/repository.txt

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nhsmm-smoke-logs-${{ github.run_id }}
          path: smoke-logs/
          if-no-files-found: warn
          retention-days: 14
