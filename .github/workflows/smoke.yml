name: NHSMM smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nhsmm-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare logs
        shell: bash
        run: |
          mkdir -p smoke-logs
          {
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            uname -a
          } | tee smoke-logs/environment.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Python diagnostics
        shell: bash
        run: |
          {
            python --version
            python -m pip --version
          } 2>&1 | tee smoke-logs/python.txt

      - name: Install package
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee smoke-logs/pip-upgrade.txt
          python -m pip install -e . 2>&1 | tee smoke-logs/install.txt
          python -m pip install pytest 2>&1 | tee smoke-logs/pytest-install.txt

      - name: Import smoke
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee smoke-logs/import.txt
          import torch
          import nhsmm
          from nhsmm import ModelConfig, NHSMM

          print("torch", torch.__version__)
          print("nhsmm", nhsmm.__file__)
          cfg = ModelConfig(n_states=3, n_features=4, max_duration=5, causal=True, dropout=0.0, seed=7)
          model = NHSMM(cfg, device="cpu")
          model.initialize_distributions()
          print("model_device", model.device)
          print("causal", model.config.causal)
          PY

      - name: Require private test-owner access
        env:
          ML_STACK_TESTS_READ_TOKEN: ${{ secrets.ML_STACK_TESTS_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$ML_STACK_TESTS_READ_TOKEN" ]; then
            echo "::error::Set ML_STACK_TESTS_READ_TOKEN with read access to awa-si/nautilus."
            exit 1
          fi

      - name: Checkout canonical model tests
        uses: actions/checkout@v7
        with:
          repository: awa-si/nautilus
          token: ${{ secrets.ML_STACK_TESTS_READ_TOKEN }}
          ref: 6ea0c7b5e535b75eba2c906c191d1d53768fd73f
          path: ml-stack

      - name: Pytest suite
        working-directory: ml-stack
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/ml_stack/nhsmm 2>&1 | tee ../smoke-logs/pytest.txt

      - name: CPU runtime benchmark
        working-directory: ml-stack
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from nhsmm import ModelConfig, NHSMM, save_artifact

          config = ModelConfig(
              n_states=3,
              n_features=4,
              max_duration=5,
              causal=True,
              dropout=0.0,
              seed=61,
          )
          model = NHSMM(config, device="cpu")
          model.initialize_distributions()
          model.eval()
          save_artifact(model, "/tmp/nhsmm-smoke-model.pt")
          PY
          python -m adapter.qlib.nhsmm_research.benchmark_runtime /tmp/nhsmm-smoke-model.pt --steps 128 --warmup 16 --batch-size 1 \
            | tee ../smoke-logs/runtime-benchmark.json

      - name: Collect repository state
        if: always()
        shell: bash
        run: |
          {
            echo "sha=${GITHUB_SHA}"
            git status --short
            git log -1 --oneline
          } 2>&1 | tee smoke-logs/repository.txt

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nhsmm-smoke-logs-${{ github.run_id }}
          path: smoke-logs/
          if-no-files-found: warn
          retention-days: 14
