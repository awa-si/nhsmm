name: NHSMM smoke

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/smoke.yml"
      - "tests/test_runtime_scoring.py"

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run NHSMM smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare logs
        shell: bash
        run: |
          mkdir -p smoke-logs
          {
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            uname -a
          } | tee smoke-logs/environment.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python diagnostics
        shell: bash
        run: |
          {
            python --version
            python -m pip --version
          } 2>&1 | tee smoke-logs/python.txt

      - name: Install package
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee smoke-logs/pip-upgrade.txt
          python -m pip install -e . 2>&1 | tee smoke-logs/install.txt
          python -m pip install pytest 2>&1 | tee smoke-logs/pytest-install.txt

      - name: Import smoke
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee smoke-logs/import.txt
          import torch
          import nhsmm
          from nhsmm import ModelConfig, NHSMM

          print("torch", torch.__version__)
          print("nhsmm", nhsmm.__file__)
          cfg = ModelConfig(n_states=3, n_features=4, max_duration=5, causal=True, dropout=0.0, seed=7)
          model = NHSMM(cfg, device="cpu")
          model.initialize_distributions()
          print("model_device", model.device)
          print("causal", model.config.causal)
          PY

      - name: Pytest suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee smoke-logs/pytest.txt

      - name: Production CPU runtime benchmark
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from nhsmm import ModelConfig, NHSMM, save_artifact

          config = ModelConfig(
              n_states=3,
              n_features=4,
              max_duration=5,
              causal=True,
              dropout=0.0,
              seed=61,
          )
          model = NHSMM(config, device="cpu")
          model.initialize_distributions()
          model.eval()
          save_artifact(model, "/tmp/nhsmm-smoke-model.pt")
          PY
          python scripts/benchmark_runtime.py /tmp/nhsmm-smoke-model.pt --steps 128 --warmup 16 --batch-size 1 \
            | tee smoke-logs/runtime-benchmark.json

      - name: Collect repository state
        if: always()
        shell: bash
        run: |
          {
            echo "sha=${GITHUB_SHA}"
            git status --short
            git log -1 --oneline
          } 2>&1 | tee smoke-logs/repository.txt

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhsmm-smoke-logs-${{ github.run_id }}
          path: smoke-logs/
          if-no-files-found: warn
          retention-days: 14
