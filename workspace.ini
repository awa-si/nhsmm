[workspace]
# CPU ML toolchain for NHSMM development and PyTorch tests.
# GPT may override individual jobs with another allowlisted image as needed.
base = ml
# Read-only datasets: nautilus = native catalogs; binance = Klines source data.
data = nautilus,binance

[resources]
# Bounded CPU-only ML validation: four workers and 8 GiB for PyTorch.
cpu = 4
memory_mb = 8192
# Editable dependencies, test artifacts and external caches; not source data.
storage_mb = 8192
# Avoid excessive process creation; reserve 1 GiB for temporary execution files.
pids = 256
tmp_mb = 1024
