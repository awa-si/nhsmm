[workspace]
# Minimum Python toolchain; not a fixed job image.
# GPT may override per job with an explicitly allowlisted image (build for Rust, ml for ML).
base = py
data = nautilus

[resources]
# NHSMM development installs PyTorch and runs the full CPU test suite.
cpu = 4
memory_mb = 8192
storage_mb = 8192
pids = 512
tmp_mb = 1024
