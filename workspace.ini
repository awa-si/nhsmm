[workspace]
# CPU ML toolchain for NHSMM development and PyTorch tests.
# GPT may override individual jobs with another allowlisted image as needed.
base = ml
data = nautilus

[resources]
# NHSMM development installs PyTorch and runs the full CPU test suite.
cpu = 4
memory_mb = 8192
storage_mb = 8192
pids = 512
tmp_mb = 1024
